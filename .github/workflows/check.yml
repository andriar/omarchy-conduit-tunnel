name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install qmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qt6-declarative-dev-tools
      - name: Sanity checks
        env:
          REQUIRE_QMLLINT: "1"
        run: scripts/check.sh
